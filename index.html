<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>시간표</title>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="시간표"/>
  <meta name="theme-color" content="#0f1117"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e8eaf0;
      --text-muted: #6b6f80;
      --accent: #7c6ff7;
      --accent2: #f76f9a;
      --accent3: #6ff7c5;
      --accent4: #f7c46f;
      --accent5: #6fc5f7;
      --accent6: #f76f6f;
      --cell-h: 60px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      padding: 12px;
      padding-top: calc(12px + env(safe-area-inset-top));
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -200px; left: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(124,111,247,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 span.dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      align-items: center;
    }

    .controls select, .controls input[type=text], .controls input[type=time] {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .controls select:focus, .controls input:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--text); }

    /* Color picker dots */
    .color-picker {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .color-dot {
      width: 20px; height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
    }

    .color-dot:hover { transform: scale(1.2); }
    .color-dot.selected { border-color: #fff; }

    /* Timetable grid */
    .table-wrap {
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      width: 100%;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
    }

    thead th {
      padding: 8px 2px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    thead th:first-child {
      width: 44px;
      color: var(--text-muted);
      font-size: 0.65rem;
    }

    tbody tr { border-bottom: 1px solid rgba(42,45,58,0.5); }
    tbody tr:last-child { border-bottom: none; }

    tbody td {
      height: var(--cell-h);
      border-right: 1px solid var(--border);
      position: relative;
      vertical-align: top;
    }

    tbody td:last-child { border-right: none; }

    .time-cell {
      font-size: 0.62rem;
      color: var(--text-muted);
      text-align: center;
      padding: 4px 2px 0;
      width: 44px;
      min-width: 44px;
    }

    .slot {
      width: 100%;
      height: 100%;
      cursor: pointer;
      transition: background 0.1s;
    }

    .slot:hover { background: rgba(124,111,247,0.06); }

    /* Subject card */
    .subject-card {
      position: absolute;
      left: 2px; right: 2px;
      top: 2px; bottom: 2px;
      border-radius: 6px;
      padding: 4px 4px;
      font-size: 0.65rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 2;
      transition: transform 0.15s, box-shadow 0.15s;
      animation: fadeIn 0.2s ease;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    .subject-card:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .subject-card .name { font-weight: 700; word-break: keep-all; line-height: 1.2; }

    /* Modal */
    .modal-bg {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-bg.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      width: 340px;
      max-width: 95vw;
      animation: slideUp 0.2s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .modal h2 { font-size: 1rem; margin-bottom: 18px; }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .form-row label { font-size: 0.78rem; color: var(--text-muted); }

    .form-row input, .form-row select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 12px;
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-row input:focus, .form-row select:focus { border-color: var(--accent); }

    .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

    .btn-danger {
      background: rgba(247,111,111,0.15);
      color: var(--accent6);
      border: 1px solid rgba(247,111,111,0.3);
    }
    .btn-danger:hover { background: rgba(247,111,111,0.25); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--accent);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s;
      pointer-events: none;
      z-index: 999;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    /* Legend */
    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 16px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; }
  </style>
</head>
<body>

<h1><span class="dot"></span>내 시간표</h1>

<div class="controls">
  <input type="text" id="subjectName" placeholder="과목명" style="width:130px"/>
  <div class="color-picker" id="colorPicker"></div>
  <button class="btn btn-ghost" onclick="clearAll()">전체 초기화</button>
</div>

<div class="table-wrap">
  <table id="timetable">
    <thead>
      <tr id="header-row">
        <th>시간</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="legend" id="legend"></div>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>📝 수업 정보</h2>
    <div class="form-row">
      <label>과목명</label>
      <input type="text" id="editName"/>
    </div>
    <div class="form-row">
      <label>색상</label>
      <div class="color-picker" id="editColorPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" onclick="deleteEntry()">삭제</button>
      <button class="btn btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DAYS = ['월', '화', '수', '목', '금'];
const PERIODS = [
  { label: '1교시', time: '09:00 ~ 09:50' },
  { label: '2교시', time: '10:00 ~ 10:50' },
  { label: '3교시', time: '11:00 ~ 11:50' },
  { label: '4교시', time: '12:00 ~ 12:50' },
  { label: '5교시', time: '13:00 ~ 13:50' },
  { label: '6교시', time: '14:00 ~ 14:50' },
  { label: '7교시', time: '15:00 ~ 15:50' },
];
const COLORS = [
  { key: 'accent',  val: '#7c6ff7', bg: 'rgba(124,111,247,0.18)', text: '#c4bfff' },
  { key: 'accent2', val: '#f76f9a', bg: 'rgba(247,111,154,0.18)', text: '#ffb8cf' },
  { key: 'accent3', val: '#6ff7c5', bg: 'rgba(111,247,197,0.18)', text: '#9dfde0' },
  { key: 'accent4', val: '#f7c46f', bg: 'rgba(247,196,111,0.18)', text: '#ffe4a8' },
  { key: 'accent5', val: '#6fc5f7', bg: 'rgba(111,197,247,0.18)', text: '#b2e1ff' },
  { key: 'accent6', val: '#f76f6f', bg: 'rgba(247,111,111,0.18)', text: '#ffb8b8' },
];

let selectedColor = COLORS[0];
let schedule = {}; // key: "day-hour" => { name, room, prof, color }
let editKey = null;

// Build header
const headerRow = document.getElementById('header-row');
DAYS.forEach(d => {
  const th = document.createElement('th');
  th.textContent = d;
  headerRow.appendChild(th);
});

// Build body
const tbody = document.getElementById('tbody');
PERIODS.forEach((period, pi) => {
  const tr = document.createElement('tr');

  const timeTd = document.createElement('td');
  timeTd.className = 'time-cell';
  timeTd.innerHTML = `<div style="font-weight:600;color:var(--text)">${period.label}</div>`;
  tr.appendChild(timeTd);

  DAYS.forEach((d, di) => {
    const td = document.createElement('td');
    td.id = `cell-${di}-${pi}`;
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.onclick = () => handleCellClick(di, pi);
    td.appendChild(slot);
    tr.appendChild(td);
  });

  tbody.appendChild(tr);
});

// Color picker builder
function buildColorPicker(containerId, onSelect) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  COLORS.forEach(c => {
    const dot = document.createElement('div');
    dot.className = 'color-dot' + (c.key === selectedColor.key ? ' selected' : '');
    dot.style.background = c.val;
    dot.title = c.key;
    dot.onclick = () => {
      selectedColor = c;
      if (onSelect) onSelect(c);
      buildColorPicker(containerId, onSelect);
    };
    container.appendChild(dot);
  });
}

buildColorPicker('colorPicker', null);

function handleCellClick(di, h) {
  const name = document.getElementById('subjectName').value.trim();
  if (!name) { showToast('과목명을 입력하세요'); return; }
  const key = `${di}-${h}`;
  schedule[key] = {
    name,
    color: selectedColor
  };
  renderCell(di, h);
  updateLegend();
  save();
}

function renderCell(di, h) {
  const key = `${di}-${h}`;
  const td = document.getElementById(`cell-${di}-${h}`);
  td.innerHTML = '';

  if (schedule[key]) {
    const s = schedule[key];
    const c = s.color;
    const slot = document.createElement('div');
    slot.className = 'slot';

    const card = document.createElement('div');
    card.className = 'subject-card';
    card.style.background = c.bg;
    card.style.borderLeft = `3px solid ${c.val}`;
    card.style.color = c.text;
    card.innerHTML = `<span class="name">${s.name}</span>`;
    card.onclick = (e) => { e.stopPropagation(); openEdit(key); };

    td.appendChild(slot);
    td.appendChild(card);
    slot.onclick = () => handleCellClick(di, h);
  } else {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.onclick = () => handleCellClick(di, h);
    td.appendChild(slot);
  }
}

function openEdit(key) {
  editKey = key;
  const s = schedule[key];
  document.getElementById('editName').value = s.name;
  selectedColor = s.color;
  buildColorPicker('editColorPicker', null);
  document.getElementById('modalBg').classList.add('open');
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
  editKey = null;
}

function saveEdit() {
  if (!editKey) return;
  const name = document.getElementById('editName').value.trim();
  if (!name) { showToast('과목명을 입력하세요'); return; }
  schedule[editKey] = {
    name,
    color: selectedColor
  };
  const [di, h] = editKey.split('-').map(Number);
  renderCell(di, h);
  updateLegend();
  save();
  closeModal();
  showToast('저장됐어요!');
}

function deleteEntry() {
  if (!editKey) return;
  delete schedule[editKey];
  const [di, h] = editKey.split('-').map(Number);
  renderCell(di, h);
  updateLegend();
  save();
  closeModal();
}

function clearAll() {
  if (!confirm('시간표를 모두 초기화할까요?')) return;
  schedule = {};
  PERIODS.forEach((_, pi) => {
    DAYS.forEach((_, di) => renderCell(di, pi));
  });
  updateLegend();
  save();
}

function updateLegend() {
  const seen = {};
  Object.values(schedule).forEach(s => { seen[s.name] = s.color; });
  const legend = document.getElementById('legend');
  legend.innerHTML = Object.entries(seen).map(([name, c]) =>
    `<div class="legend-item"><div class="legend-dot" style="background:${c.val}"></div>${name}</div>`
  ).join('');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// LocalStorage
function save() {
  try { localStorage.setItem('timetable_v1', JSON.stringify(schedule)); } catch(e){}
}

function load() {
  try {
    const raw = localStorage.getItem('timetable_v1');
    if (raw) {
      schedule = JSON.parse(raw);
      Object.keys(schedule).forEach(key => {
        const [di, h] = key.split('-').map(Number);
        renderCell(di, h);
      });
      updateLegend();
    }
  } catch(e){}
}

// Click outside modal to close
document.getElementById('modalBg').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Service Worker 등록
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

load();
</script>
</body>
</html>
